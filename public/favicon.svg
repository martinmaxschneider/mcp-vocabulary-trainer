<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sprachen Daily">
  <defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="rgba(147,174,196,0.45)" stroke-width="2"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e3a5f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- squared notebook paper -->
  <rect width="512" height="512" fill="#eef4fa"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <!-- red margin line -->
  <rect x="62" y="0" width="4" height="512" fill="#d45d5d"/>

  <!-- back bubble: the reply in the other language -->
  <g fill="#1e3a5f">
    <rect x="212" y="72" width="230" height="146" rx="38"/>
    <path d="M388 210 L412 254 L344 214 Z"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.92">
    <circle cx="282" cy="128" r="13"/>
    <circle cx="327" cy="128" r="13"/>
    <circle cx="372" cy="128" r="13"/>
  </g>

  <!-- front bubble: listen -->
  <g filter="url(#soft)">
    <rect x="96" y="146" width="290" height="200" rx="48" fill="#ffffff"/>
    <path d="M152 332 L132 406 L224 340 Z" fill="#ffffff"/>
  </g>

  <path d="M186 206 L186 286 L254 246 Z"
        fill="#1e3a5f" stroke="#1e3a5f" stroke-width="14" stroke-linejoin="round"/>
  <g fill="none" stroke="#1e3a5f" stroke-width="18" stroke-linecap="round">
    <path d="M282 224 A 32 32 0 0 1 282 268"/>
    <path d="M310 208 A 54 54 0 0 1 310 284"/>
  </g>
</svg>
