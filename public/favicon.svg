<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sprachen Daily">
  <defs>
    <pattern id="grid" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M128 0H0V128" fill="none" stroke="rgba(30,58,95,0.48)" stroke-width="8"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1e3a5f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- cahier paper -->
  <rect width="512" height="512" fill="#ffffff"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <!-- red margin line -->
  <rect x="40" y="0" width="16" height="512" fill="#d07a7a"/>

  <!-- listen bubble -->
  <path
    filter="url(#soft)"
    fill="#1e3a5f"
    d="M156 146 H356 A50 50 0 0 1 406 196 V304 A50 50 0 0 1 356 354
       H214 L150 408 L184 354 H156 A50 50 0 0 1 106 304 V196 A50 50 0 0 1 156 146 Z"
  />

  <path d="M150 202 L150 298 L236 250 Z"
        fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
  <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round">
    <path d="M264 214 A 36 36 0 0 1 264 286"/>
    <path d="M300 194 A 60 60 0 0 1 300 306"/>
  </g>
</svg>
