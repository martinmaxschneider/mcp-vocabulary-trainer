<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sprachen Daily">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.6" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#134E4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="75%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#042F2E" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- back bubble: the other language answering -->
  <g fill="#FFFFFF" fill-opacity="0.16">
    <rect x="200" y="76" width="236" height="150" rx="40"/>
    <path d="M380 218 L404 262 L336 222 Z"/>
  </g>
  <g fill="#FDF6E9" fill-opacity="0.85">
    <circle cx="272" cy="151" r="13"/>
    <circle cx="318" cy="151" r="13"/>
    <circle cx="364" cy="151" r="13"/>
  </g>

  <!-- front bubble: listen -->
  <g filter="url(#soft)" fill="#FDF6E9">
    <rect x="76" y="150" width="290" height="200" rx="48"/>
    <path d="M132 336 L112 410 L204 344 Z"/>
  </g>

  <path d="M166 210 L166 290 L234 250 Z"
        fill="#0F766E" stroke="#0F766E" stroke-width="14" stroke-linejoin="round"/>
  <g fill="none" stroke="#0F766E" stroke-width="18" stroke-linecap="round">
    <path d="M262 228 A 32 32 0 0 1 262 272"/>
    <path d="M290 212 A 54 54 0 0 1 290 288"/>
  </g>
</svg>
